plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
version='1.1.1'
group='io.atlas'
base { archivesName='atlas-interface' }
repositories { mavenCentral() }
dependencies {
 minecraft "com.mojang:minecraft:${minecraft_version}"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:${loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
java { sourceCompatibility=JavaVersion.VERSION_21; targetCompatibility=JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json'){expand version:project.version} }
