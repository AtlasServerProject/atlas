services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: atlas_api_local
      POSTGRES_USER: atlas_api_bootstrap
      POSTGRES_PASSWORD: ${ATLAS_BOOTSTRAP_PASSWORD:?Generate a local bootstrap password}
      ATLAS_MIGRATION_PASSWORD: ${ATLAS_MIGRATION_PASSWORD:?Generate a migration password}
      ATLAS_DB_PASSWORD: ${ATLAS_DB_PASSWORD:?Generate a runtime password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - atlas_api_pg:/var/lib/postgresql
      - ./infra/postgres/provision.sql:/atlas-provision.sql:ro
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-atlas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_api_bootstrap -d atlas_api_local"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  atlas_api_pg:
